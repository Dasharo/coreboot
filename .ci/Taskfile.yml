version: '3'

includes:
  build: tasks/build.yml
  blobs: tasks/blobs.yml
  test: tasks/test.yml
  image: tasks/image.yml
  report: tasks/report.yml

tasks:
  ci:blobs:
    desc: Download blobs
    cmds:
      - task: blobs:main

  ci:build-ec:
    desc: Build EC
    cmds:
      - task: build:ec

  ci:build-coreboot:
    desc: Build coreboot
    cmds:
      - task: build:main

  ci:test:
    desc: Run tests on build firmware
    cmds:
      - task: test:clone
      - task: test:main

  ci:image:build:
    desc: Build the CI image, tagged with a UTC timestamp and latest
    cmds:
      - task: image:build

  ci:image:release:
    desc: Build and push the CI image
    cmds:
      - task: image:release

  ci:report:init:
    desc: Create CI result object on GH
    cmds:
      - task: report:init

  ci:report:publish:
    desc: Publish CI results of this workflow to GH
    cmds:
      - task: report:publish

  ci:cleanup:
    desc: Clean up all build artifacts that were created for other tasks to use
    dir:  '{{.REPO_ROOT}}'
    cmds:
      - rm -rf build *.cap ec.rom osfv test-logs
      - '{{if .HOSTPATH}}rm -rf {{.HOSTPATH}}{{end}}'
