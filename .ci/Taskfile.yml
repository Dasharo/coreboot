version: '3'

vars:
  REPO_ROOT:
    sh: git rev-parse --show-toplevel

includes:
  build: tasks/build.yml
  blobs: tasks/blobs.yml
  test: tasks/test.yml
  image: tasks/image.yml
  report: tasks/report.yml
  checks: tasks/checks.yml
  upstream: tasks/upstream.yml

tasks:
  ci:check:
    desc: Run one source check (CHECK=upstream-status|lint-stable|lint-extended|defconfigs|capsule-lint)
    requires:
      vars: [CHECK]
    cmds:
      - task: 'checks:{{.CHECK}}'

  ci:tag-check:
    desc: Verify the pushed tag is annotated and signed
    cmds:
      - task: checks:tag-annotated
      - task: checks:tag-signed

  ci:tag-capsule-versioning:
    desc: Verify capsule version transitions for the pushed tag
    cmds:
      - task: checks:tag-capsule-versioning

  ci:ucode:check:
    desc: Fail if the Intel µcode submodule is out of date
    cmds:
      - task: checks:ucode-up-to-date

  ci:ucode:update:
    desc: Update the Intel µcode submodule and open a pull request
    cmds:
      - task: checks:ucode-update

  ci:blobs:
    desc: Download blobs
    cmds:
      - task: blobs:main

  ci:build-ec:
    desc: Build EC
    cmds:
      - task: build:ec

  ci:build-coreboot:
    desc: Build coreboot
    cmds:
      - task: build:main

  ci:test:
    desc: Run tests on build firmware
    cmds:
      - task: test:clone
      - task: test:main

  ci:image:build:
    desc: Build the CI image, tagged with a UTC timestamp and latest
    cmds:
      - task: image:build

  ci:image:release:
    desc: Build and push the CI image
    cmds:
      - task: image:release

  ci:report:init:
    desc: Create CI result object on GH
    cmds:
      - task: report:init

  ci:report:publish:
    desc: Publish CI results of this workflow to GH
    cmds:
      - task: report:publish

  ci:cleanup:
    desc: Clean up all build artifacts that were created for other tasks to use
    dir:  '{{.REPO_ROOT}}'
    cmds:
      - rm -rf build *.cap ec.rom osfv test-logs
      - '{{if .HOSTPATH}}rm -rf {{.HOSTPATH}}{{end}}'

  ci:upstream:pull:
    desc: Update the main branch containing upstream state
    dir:  '{{.REPO_ROOT}}'
    cmds:
      - task: upstream:pull