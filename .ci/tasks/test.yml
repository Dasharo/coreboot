version: '3'

vars:
  REPO_ROOT:
    sh: git rev-parse --show-toplevel

tasks:
  clone:
    desc: Clone OSFV
    dir: '{{.REPO_ROOT}}'
    cmds:
      - rm -rf osfv
      - |
        git clone --depth 1 --recurse-submodules --branch using-stability-ci-outside \
        https://ci:$GITEA_TOKEN@git.3mdeb.com/Dasharo/open-source-firmware-validation.git \
        osfv

  main:
    desc: Test build firmware
    dir: '{{.REPO_ROOT}}'
    requires:
      vars: [TEST_CONFIG]
    cmds:
      - |
        DEVICE={{.REPO_ROOT}}/{{.TEST_CONFIG}} REPEATS=1 LOGS_DIR={{.REPO_ROOT}}/test-logs \
        OSFV_ROMS_DIR={{.REPO_ROOT}}/build QEMU="${QEMU}" \
        {{if .MANUAL_TESTS_LIST}}MANUAL_TESTS_LIST={{.REPO_ROOT}}/{{.MANUAL_TESTS_LIST}}{{end}} \
        task -t osfv/.ci/Taskfile.yml -d osfv ci:stability-device;
