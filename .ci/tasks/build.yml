version: '3'

includes:
  docker: common/docker-run.yml

vars:
  REPO_ROOT:
    sh: git rev-parse --show-toplevel

tasks:
  ec:
    desc: Build EC
    dir: '{{.REPO_ROOT}}'
    requires:
      vars: [EC_BOARD_VENDOR, EC_BOARD_MODEL, HOSTPATH]
    env:
      EC_BOARD_VENDOR: '{{.EC_BOARD_VENDOR}}'
      EC_BOARD_MODEL: '{{.EC_BOARD_MODEL}}'
    cmds:
      - echo "Would build EC {{.EC_BOARD_VENDOR}} - {{.EC_BOARD_MODEL}}"
      - rm -rf ec.rom
      - rm -rf {{.HOSTPATH}}
      - mkdir -p {{.HOSTPATH}}
      - git clone --depth 1 --recurse-submodules https://ci:$GITEA_TOKEN@git.3mdeb.com/Dasharo/ec.git {{.HOSTPATH}}/ec
      - cd {{.HOSTPATH}}/ec && ./build.sh;
      - test -f {{.HOSTPATH}}/ec/{{.EC_BOARD_VENDOR}}_{{.EC_BOARD_MODEL}}_ec.rom
      - cp {{.HOSTPATH}}/ec/{{.EC_BOARD_VENDOR}}_{{.EC_BOARD_MODEL}}_ec.rom ec.rom
      - chown "$(stat -c %u:%g .)" ec.rom
      - rm -rf {{.HOSTPATH}}


  main:
    desc: Build coreboot with build.sh for BOARD
    dir: '{{.REPO_ROOT}}'
    requires:
      vars: [BOARD, HOSTPATH]
    env:
      SSH_AUTH_SOCK: ""
    cmds:
      - rm -rf {{.HOSTPATH}} build
      - mkdir -p {{.HOSTPATH}}
      - cp -a . {{.HOSTPATH}}
      - chown -R 0:0 {{.HOSTPATH}}
      - cd {{.HOSTPATH}} && ./build.sh {{.BOARD}}
      - rm -rf build && cp -a {{.HOSTPATH}}/build build
      - rm -rf {{.HOSTPATH}}
      - chown -R "$(stat -c %u:%g .)" build
      - test -f build/coreboot.rom
