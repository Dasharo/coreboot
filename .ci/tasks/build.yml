version: '3'

includes:
  docker: common/docker-run.yml

vars:
  REPO_ROOT:
    sh: git rev-parse --show-toplevel

tasks:
  ec:
    desc: Build EC
    dir: '{{.REPO_ROOT}}'
    requires:
      vars: [EC_BOARD_VENDOR, EC_BOARD_MODEL, HOSTPATH]
    env:
      EC_BOARD_VENDOR: '{{.EC_BOARD_VENDOR}}'
      EC_BOARD_MODEL: '{{.EC_BOARD_MODEL}}'
      EC_REV: '{{.EC_REV | default "master"}}'
    cmds:
      - rm -rf ec.rom
      - rm -rf {{.HOSTPATH}}
      - mkdir -p {{.HOSTPATH}}
      - git clone --recurse-submodules https://ci:$GITEA_TOKEN@git.3mdeb.com/Dasharo/ec.git {{.HOSTPATH}}/ec
      - cd {{.HOSTPATH}}/ec && git checkout --recurse-submodules "${EC_REV}"
      - cd {{.HOSTPATH}}/ec && ./build.sh;
      - test -f {{.HOSTPATH}}/ec/{{.EC_BOARD_VENDOR}}_{{.EC_BOARD_MODEL}}_ec.rom
      - cp {{.HOSTPATH}}/ec/{{.EC_BOARD_VENDOR}}_{{.EC_BOARD_MODEL}}_ec.rom ec.rom
      - chown "$(stat -c %u:%g .)" ec.rom
      - rm -rf {{.HOSTPATH}}


  main:
    desc: Build coreboot with build.sh for BOARD
    dir: '{{.REPO_ROOT}}'
    requires:
      vars: [BOARD, HOSTPATH]
    env:
      SSH_AUTH_SOCK: ""
      # Chainging the repo and Rev for other modules
      # possible once it's supported by the Kconfigs
      # E.g. iPXE is not today when this comment is written
      EDK2_REPO: '{{.EDK2_REPO}}'
      EDK2_REV: '{{.EDK2_REV}}'
      CONFIG_OVERRIDES: |
        {{if .EDK2_REPO}}CONFIG_EDK2_REPOSITORY="{{.EDK2_REPO}}"{{end}}
        {{if .EDK2_REV}}CONFIG_EDK2_TAG_OR_REV="{{.EDK2_REV}}"{{end}}

    cmds:
      - rm -rf {{.HOSTPATH}} build *.cap
      - mkdir -p {{.HOSTPATH}}
      - cp -a . {{.HOSTPATH}}
      - chown -R 0:0 {{.HOSTPATH}}
      # Configuring submodule revisions example
      # - cd {{.HOSTPATH}} && git update-index --cacheinfo 160000,<rev>,3rdparty/dasharo-blobs
      - cd {{.HOSTPATH}} && ./build.sh {{.BOARD}}

      # capsule
      - |
        {{if .CAPSULE}}
        set -e
        cd {{.HOSTPATH}}
        mkdir -p keys
        cp payloads/external/edk2/workspace/Dasharo/BaseTools/Source/Python/Pkcs7Sign/Test* {{.HOSTPATH}}/keys/
        chown -R 0:0 keys
        BATTERY_FLAG=$(grep -q 'CONFIG_EDK2_ENABLE_BATTERY_CHECK 1' build/config.h && echo " -b" || true)
        ./capsule.sh make \
          -t keys/TestRoot.pub.pem \
          -o keys/TestSub.pub.pem \
          -s keys/TestCert.pem \
          $BATTERY_FLAG
        {{end}}

      - rm -rf build && cp -a {{.HOSTPATH}}/build build
      - '{{if .CAPSULE}}cp {{.HOSTPATH}}/*.cap ./{{end}}'
      - rm -rf {{.HOSTPATH}}
      - chown -R "$(stat -c %u:%g .)" build
      - test -f build/coreboot.rom
