version: '3'

vars:
  BLOBS_LIST:
    map:
      novacustom:
        method: clone
        url: https://git.3mdeb.com/Dasharo/novacustom-blobs.git
        ref: 33612cfaa9d21f8048a5f1e7716da3129df0d225
        path: 3rdparty/blobs/mainboard
        token: NCM_BLOBS_TOKEN


tasks:
  main:
    desc: Download blobs
    requires:
      vars: [BLOBS]
    cmds:
      - git -C "$(git rev-parse --show-toplevel)" submodule update --init --checkout 3rdparty/blobs
      - for: {var: BLOBS, split: ','}
        task: fetch
        vars:
          NAME: '{{.ITEM}}'
  fetch:
    vars:
      BLOB:
        ref: index .BLOBS_LIST .NAME
    env:
      BLOB_NAME: '{{.NAME}}'
      BLOB_METHOD: '{{.BLOB.method}}'
      BLOB_URL: '{{.BLOB.url}}'
      BLOB_REF: '{{.BLOB.ref}}'
      BLOB_PATH: '{{.BLOB.path}}'
      BLOB_TOKEN: '{{.BLOB.token | default ""}}'
    cmds:
    - bash blobs.sh
