name: Dasharo
on:
  pull_request:
    branches:
      - dasharo-25.12
  push:
    branches:
      - dasharo-25.12
    tags:
      - '*'

jobs:
  build_novacustom_ec:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        vendor: [ novacustom ]
        model: [ nv4x_adl, ns5x_adl, nv4x_tgl, ns5x_tgl, v540tu, v560tu, v540tnx, v560tnx ]
    steps:
    - name: Checkout EC
      uses: actions/checkout@v5
      with:
        repository: Dasharo/ec
    - name: Build EC
      run: EC_BOARD_VENDOR=${{ matrix.vendor }} EC_BOARD_MODEL=${{ matrix.model }} ./build.sh
    - name: Save artifacts
      uses: actions/upload-artifact@v7
      with:
        name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}-ec"
        path: |
          ${{ matrix.vendor }}_${{ matrix.model }}_ec.rom
        retention-days: 30
  build_novacustom_laptop:
    runs-on: ubuntu-24.04
    needs: build_novacustom_ec
    strategy:
      matrix:
        vendor: [ novacustom ]
        model: [ nv4x_adl, ns5x_adl, nv4x_tgl, ns5x_tgl, v540tu, v560tu, v540tnx, v560tnx ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Checkout pull request HEAD commit instead of merge commit
          # See: https://github.com/actions/checkout#checkout-pull-request-head-commit-instead-of-merge-commit
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch complete history
          fetch-depth: 0
      - name: Checkout all submodules
        run: git submodule update --init --recursive --checkout
      - name: Obtain EC
        uses: actions/download-artifact@v5
        with:
          name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}-ec"
      - name: Obtain blobs
        uses: actions/checkout@v5
        with:
          repository: Dasharo/novacustom-blobs
          ref: 480afdc3d15bb9ec5b72b100581badea11e779f8
          path: 3rdparty/blobs/mainboard
          token: ${{ secrets.NCM_BLOBS_TOKEN }}
      - name: Build Dasharo
        run: |
          mv ${{ matrix.vendor }}_${{ matrix.model }}_ec.rom ec.rom
          ./build.sh ${{ matrix.model }}
      - name: Copy default testing keys for capsules
        run: |
          mkdir keys
          cp payloads/external/edk2/workspace/Dasharo/BaseTools/Source/Python/Pkcs7Sign/Test* keys/
      - name: Generate capsule
        run: |
          ./capsule.sh make -t keys/TestRoot.pub.pem -o keys/TestSub.pub.pem -s keys/TestCert.pem -b
      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
          path: |
            build/coreboot.rom
            *.cap
          retention-days: 30
  build_novacustom_nucbox:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        vendor: [ novacustom ]
        model: [ nuc_box ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Checkout pull request HEAD commit instead of merge commit
          # See: https://github.com/actions/checkout#checkout-pull-request-head-commit-instead-of-merge-commit
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch complete history
          fetch-depth: 0
      - name: Checkout all submodules
        run: git submodule update --init --recursive --checkout
      - name: Obtain blobs
        uses: actions/checkout@v5
        with:
          repository: Dasharo/novacustom-blobs
          ref: 480afdc3d15bb9ec5b72b100581badea11e779f8
          path: 3rdparty/blobs/mainboard
          token: ${{ secrets.NCM_BLOBS_TOKEN }}
      - name: Build Dasharo
        run: |
          ./build.sh ${{ matrix.model }}
      - name: Copy default testing keys for capsules
        run: |
          mkdir keys
          cp payloads/external/edk2/workspace/Dasharo/BaseTools/Source/Python/Pkcs7Sign/Test* keys/
      - name: Generate capsule
        run: |
          ./capsule.sh make -t keys/TestRoot.pub.pem -o keys/TestSub.pub.pem -s keys/TestCert.pem -b
      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
          path: |
            build/coreboot.rom
            *.cap
          retention-days: 30
  build_optiplex:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        vendor: [ dell ]
        model: [ optiplex_9010_sff, optiplex_9010_sff_uefi ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Checkout pull request HEAD commit instead of merge commit
          # See: https://github.com/actions/checkout#checkout-pull-request-head-commit-instead-of-merge-commit
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch complete history
          fetch-depth: 0
      - name: Checkout all submodules
        run: git submodule update --init --recursive --checkout
      - name: Build Dasharo
        run: |
          ./build.sh ${{ matrix.model }}
      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
          path: |
            build/coreboot.rom
          retention-days: 30
  build_msi:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        vendor: [ msi ]
        model: [ ms7d25_ddr4, ms7d25_ddr5, ms7e06_ddr4, ms7e06_ddr5 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Checkout pull request HEAD commit instead of merge commit
          # See: https://github.com/actions/checkout#checkout-pull-request-head-commit-instead-of-merge-commit
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch complete history
          fetch-depth: 0
      - name: Checkout all submodules
        run: git submodule update --init --recursive --checkout
      - name: Build Dasharo
        run: |
          ./build.sh ${{ matrix.model }}
          pkcs7sign=payloads/external/edk2/workspace/Dasharo/BaseTools/Source/Python/Pkcs7Sign
          ./capsule.sh make -t "$pkcs7sign"/TestRoot.pub.pem \
                            -o "$pkcs7sign"/TestSub.pub.pem \
                            -s "$pkcs7sign"/TestCert.pem
          mv *.cap build/coreboot.cap
      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
          path: |
            build/coreboot.rom
            build/coreboot.cap
          retention-days: 30
  build_protectli:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        vendor: [ protectli ]
        model: [ vp66xx, vp46xx, vp32xx, vp2440, vp2430, vp2420, vp2410, V1210, V1211, V1410, V1610 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Checkout pull request HEAD commit instead of merge commit
          # See: https://github.com/actions/checkout#checkout-pull-request-head-commit-instead-of-merge-commit
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch complete history
          fetch-depth: 0
      - name: Checkout all submodules
        run: git submodule update --init --recursive --checkout
      - name: Build Dasharo
        run: |
          ./build.sh ${{ matrix.model }}
          if grep -q CONFIG_DRIVERS_EFI_UPDATE_CAPSULES=y .config; then
            pkcs7sign=payloads/external/edk2/workspace/Dasharo/BaseTools/Source/Python/Pkcs7Sign
            ./capsule.sh make -t "$pkcs7sign"/TestRoot.pub.pem \
                              -o "$pkcs7sign"/TestSub.pub.pem \
                              -s "$pkcs7sign"/TestCert.pem
            mv *.cap build/coreboot.cap
          fi
      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
          path: |
            build/coreboot.rom
            build/coreboot.cap
          retention-days: 30
  flash_protectli_vp66xx:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dasharo-25.12'
    needs: build_protectli
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: src
      - name: Download firmware artifact
        uses: actions/download-artifact@v5
        with:
          name: dasharo-protectli-vp66xx
          path: artifact
      - name: Flash via SnipeIT-managed RTE
        env:
          SNIPEIT_IP: ${{ secrets.SNIPEIT_IP }}
          SNIPEIT_API_KEY: ${{ secrets.SNIPEIT_API_KEY }}
          SNIPEIT_UID: ${{ secrets.SNIPEIT_UID }}
        run: python3 src/.github/scripts/flash_via_snipeit.py artifact/coreboot.rom "VP66xx"
  build_pcengines:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        vendor: [ pcengines ]
        model: [ apu2, apu3, apu4, apu6 ]
        payload: [ uefi ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Checkout pull request HEAD commit instead of merge commit
          # See: https://github.com/actions/checkout#checkout-pull-request-head-commit-instead-of-merge-commit
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch complete history
          fetch-depth: 0
      - name: Checkout all submodules
        run: git submodule update --init --recursive --checkout
      - name: Build Dasharo
        run: |
          ./build.sh ${{ matrix.model }}
      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}-${{ matrix.payload }}"
          path: |
            build/coreboot.rom
          retention-days: 30
  build_q35:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        vendor: [ emulation_qemu ]
        model: [ x86_q35 ]
        payload: [ uefi, uefi_all_menus ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Checkout pull request HEAD commit instead of merge commit
          # See: https://github.com/actions/checkout#checkout-pull-request-head-commit-instead-of-merge-commit
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch complete history
          fetch-depth: 0
      - name: Build Dasharo
        run: |
          ./build.sh ${{ matrix.model }}_${{ matrix.payload }}
      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}-${{ matrix.payload }}"
          path: |
            build/coreboot.rom
          retention-days: 30
  test_q35:
    needs: build_q35
    uses: ./.github/workflows/test.yml
    strategy:
      matrix:
        vendor: [ emulation_qemu ]
        model: [ x86_q35 ]
        payload: [ uefi, uefi_all_menus ]
    with:
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}-${{ matrix.payload }}"
  build_hardkernel_odroid_h4:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        vendor: [ hardkernel ]
        model: [ odroid_h4, odroid_h4_netcard ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Checkout pull request HEAD commit instead of merge commit
          # See: https://github.com/actions/checkout#checkout-pull-request-head-commit-instead-of-merge-commit
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch complete history
          fetch-depth: 0
      - name: Checkout all submodules
        run: git submodule update --init --recursive --checkout
      - name: Build Dasharo
        run: |
          ./build.sh ${{ matrix.model }}
          pkcs7sign=payloads/external/edk2/workspace/Dasharo/BaseTools/Source/Python/Pkcs7Sign
          ./capsule.sh make -t "$pkcs7sign"/TestRoot.pub.pem \
                            -o "$pkcs7sign"/TestSub.pub.pem \
                            -s "$pkcs7sign"/TestCert.pem
          mv *.cap build/coreboot.cap
      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
          path: |
            build/coreboot.rom
            build/coreboot.cap
  build_asrock_spc741d8:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        vendor: [ asrock ]
        model: [ spc741d8 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Checkout pull request HEAD commit instead of merge commit
          # See: https://github.com/actions/checkout#checkout-pull-request-head-commit-instead-of-merge-commit
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch complete history
          fetch-depth: 0
      - name: Checkout all submodules
        run: git submodule update --init --recursive --checkout
      - name: Build Dasharo
        run: |
          ./build.sh ${{ matrix.vendor }}_${{ matrix.model }}
      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
          path: |
            build/coreboot.rom
          retention-days: 30

  deploy_protectli_adl:
    if: startsWith(github.ref, 'refs/tags/protectli_vault_adl_')
    needs: build_protectli
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: protectli
      vendor: ${{ matrix.vendor }}
      model: ${{ matrix.model }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
    secrets: inherit
    strategy:
      matrix:
        vendor: [ protectli ]
        model: [ vp66xx ]
  deploy_protectli_adl_n:
    if: startsWith(github.ref, 'refs/tags/protectli_vault_adln_')
    needs: build_protectli
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: protectli
      vendor: ${{ matrix.vendor }}
      model: ${{ matrix.model }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
    secrets: inherit
    strategy:
      matrix:
        vendor: [ protectli ]
        model: [ vp32xx ]
  deploy_protectli_vp2430:
    if: startsWith(github.ref, 'refs/tags/protectli_vp2430_')
    needs: build_protectli
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: protectli
      vendor: ${{ matrix.vendor }}
      model: ${{ matrix.model }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
    secrets: inherit
    strategy:
      matrix:
        vendor: [ protectli ]
        model: [ vp2430 ]
  deploy_protectli_vp2440:
    if: startsWith(github.ref, 'refs/tags/protectli_vp2440_')
    needs: build_protectli
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: protectli
      vendor: ${{ matrix.vendor }}
      model: ${{ matrix.model }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
    secrets: inherit
    strategy:
      matrix:
        vendor: [ protectli ]
        model: [ vp2440 ]
  deploy_protectli_jsl:
    if: startsWith(github.ref, 'refs/tags/protectli_vault_jsl')
    needs: build_protectli
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: protectli
      vendor: ${{ matrix.vendor }}
      model: ${{ matrix.model }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
    secrets: inherit
    strategy:
      matrix:
        vendor: [ protectli ]
        model: [ V1210, V1211, V1410, V1610 ]
  deploy_protectli_glk:
    if: startsWith(github.ref, 'refs/tags/protectli_vault_glk')
    needs: build_protectli
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: protectli
      vendor: ${{ matrix.vendor }}
      model: ${{ matrix.model }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
    secrets: inherit
    strategy:
      matrix:
        vendor: [ protectli ]
        model: [ vp2410 ]
  deploy_protectli_ehl:
    if: startsWith(github.ref, 'refs/tags/protectli_vault_ehl')
    needs: build_protectli
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: protectli
      vendor: ${{ matrix.vendor }}
      model: ${{ matrix.model }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
    secrets: inherit
    strategy:
      matrix:
        vendor: [ protectli ]
        model: [ vp2420 ]
  deploy_protectli_cml:
    if: startsWith(github.ref, 'refs/tags/protectli_vault_cml')
    needs: build_protectli
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: protectli
      vendor: ${{ matrix.vendor }}
      model: ${{ matrix.model }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
    secrets: inherit
    strategy:
      matrix:
        vendor: [ protectli ]
        model: [ vp46xx ]
  deploy_novacustom_adl:
    if: startsWith(github.ref, 'refs/tags/novacustom') && contains(github.ref, 'adl')
    needs: build_novacustom_laptop
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: novacustom
      vendor: ${{ matrix.vendor }}
      model: ${{ matrix.model }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
    secrets: inherit
    strategy:
      matrix:
        vendor: [ novacustom ]
        model: [ nv4x_adl, ns5x_adl ]
  deploy_novacustom_tgl:
    if: startsWith(github.ref, 'refs/tags/novacustom') && contains(github.ref, 'tgl')
    needs: build_novacustom_laptop
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: novacustom
      vendor: ${{ matrix.vendor }}
      model: ${{ matrix.model }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
    secrets: inherit
    strategy:
      matrix:
        vendor: [ novacustom ]
        model: [ nv4x_tgl, ns5x_tgl ]
  deploy_pcengines:
    if: startsWith(github.ref, 'refs/tags/pcengines')
    needs: build_pcengines
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: pcengines
      vendor: ${{ matrix.vendor }}
      model: ${{ matrix.model }}
      payload: ${{ matrix.payload }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}-${{ matrix.payload }}"
    secrets: inherit
    strategy:
      matrix:
        vendor: [ pcengines ]
        model: [ apu2, apu3, apu4, apu6 ]
        payload: [ uefi ]
  deploy_msi_ms7d25:
    if: startsWith(github.ref, 'refs/tags/msi_ms7d25')
    needs: build_msi
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: msi
      vendor: ${{ matrix.vendor }}
      model: "ms7d25"
      type: ${{ matrix.type }}
      artifact_name: "dasharo-${{ matrix.vendor }}-ms7d25_${{ matrix.type }}"
      released_by_3mdeb: true
    secrets: inherit
    strategy:
      matrix:
        vendor: [ msi ]
        type: [ ddr4, ddr5 ]
  deploy_msi_ms7e06:
    if: startsWith(github.ref, 'refs/tags/msi_ms7e06')
    needs: build_msi
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: msi
      vendor: ${{ matrix.vendor }}
      model: "ms7e06"
      type: ${{ matrix.type }}
      artifact_name: "dasharo-${{ matrix.vendor }}-ms7e06_${{ matrix.type }}"
      released_by_3mdeb: true
    secrets: inherit
    strategy:
      matrix:
        vendor: [ msi ]
        type: [ ddr4, ddr5 ]
  deploy_hardkernel_odroid:
    if: startsWith(github.ref, 'refs/tags/hardkernel_odroid_h4')
    needs: build_hardkernel_odroid_h4
    uses: ./.github/workflows/deploy-template.yml
    with:
      platform: hardkernel
      model: ${{ matrix.model }}
      vendor: ${{ matrix.model }}
      artifact_name: "dasharo-${{ matrix.vendor }}-${{ matrix.model }}"
      released_by_3mdeb: true
    secrets: inherit
    strategy:
      matrix:
        vendor: [ hardkernel ]
        model: [ odroid_h4 ]
