when:
  - branch: dasharo
    event: [pull_request, manual]
    path:
      include:
        - 'src/**'
        - 'configs/**'

labels:
  network: office

matrix:
  include:
      # Emulation
    - DEVICE: qemu
      TEST_CONFIG: "qemu"
      BOARD: "x86_q35_uefi_all_menus"

      # Novacustom
    - DEVICE: v540tnx
      TEST_CONFIG: "novacustom-v540tnd_00266"
      BOARD: "v540tnx"
      EC_BOARD_VENDOR: "novacustom"
      EC_BOARD_MODEL: "v540tu"
      BLOBS: "novacustom"
      CAPSULE: "yes"

      # MSI
    - DEVICE: ms7d25_ddr4
      TEST_CONFIG: "msi-pro-z690-a-wifi-ddr4_00039"
      BOARD: "ms7d25_ddr4"
      CAPSULE: "yes"

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false
      depth: 0

steps:
  - name: ec
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/coreboot-builds:/tmp/coreboot-builds
    when:
      - matrix:
          EC_BOARD_VENDOR: "?*"
          EC_BOARD_MODEL: "?*"
    environment:
      GITEA_TOKEN:
        from_secret: NCM_BLOBS_TOKEN # TODO own token
      HOSTPATH: /tmp/coreboot-builds/${CI_PIPELINE_NUMBER}-${BOARD}
    commands:
      - docker run --rm -v /tmp/coreboot-builds:/w alpine rm -rf /w/{{base .HOSTPATH}}
      - task --taskfile .ci/Taskfile.yml ci:build-ec EC_BOARD_VENDOR=${EC_BOARD_VENDOR} EC_BOARD_MODEL=${EC_BOARD_MODEL} HOSTPATH="$${HOSTPATH}"
      - docker run --rm -v /tmp/coreboot-builds:/w alpine rm -rf /w/{{base .HOSTPATH}}


  - name: blobs
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    when:
      - matrix:
          BLOBS: "?*"
    environment:
      BLOBS_TOKEN:
        from_secret: NCM_BLOBS_TOKEN
    commands:
      - task --taskfile .ci/Taskfile.yml ci:blobs BLOBS=${BLOBS}


  - name: build
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/coreboot-builds:/tmp/coreboot-builds
    environment:
      SSH_AUTH_SOCK: /tmp/no-ssh-agent
      HOSTPATH: /tmp/coreboot-builds/${CI_PIPELINE_NUMBER}-${BOARD}
    when:
      - matrix:
          BOARD: "?*"
    commands:
      - docker run --rm -v /tmp/coreboot-builds:/w alpine rm -rf /w/{{base .HOSTPATH}}
      - task --taskfile .ci/Taskfile.yml ci:build-coreboot BOARD="${BOARD}" HOSTPATH="$${HOSTPATH}"
      - docker run --rm -v /tmp/coreboot-builds:/w alpine rm -rf /w/{{base .HOSTPATH}}

  - name: build-capsule
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/coreboot-builds:/tmp/coreboot-builds
    environment:
      SSH_AUTH_SOCK: /tmp/no-ssh-agent
      HOSTPATH: /tmp/coreboot-builds/${CI_PIPELINE_NUMBER}-${BOARD}
    when:
      - matrix:
          BOARD: "?*"
          CAPSULE: "yes"
    commands:
      - docker run --rm -v /tmp/coreboot-builds:/w alpine rm -rf /w/{{base .HOSTPATH}}
      - task --taskfile .ci/Taskfile.yml ci:build-capsule BOARD="${BOARD}" HOSTPATH="$${HOSTPATH}"
      - docker run --rm -v /tmp/coreboot-builds:/w alpine rm -rf /w/{{base .HOSTPATH}}


  - name: test
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    when:
      - matrix:
          TEST_CONFIG: "?*"
    commands:
      - task --taskfile .ci/Taskfile.yml ci:test TEST_CONFIG=${TEST_CONFIG}
