when:
  - branch: dasharo
    event: [pull_request, push, manual]
  - branch:  woodpecker-build-test-ci
    event: [manual]
  - event: tag

labels:
  network: ${NETWORK} # must be set to "office" to run tests on hardware
  kvm: ${QEMU} # set in matrix

matrix:
  include:
      # Emulation
    - BOARD: "x86_q35_uefi_all_menus"
      TEST_CONFIG: ".ci/devices/qemu.json"
      MANUAL_TESTS_LIST: ".ci/test_lists/qemu.txt"
      QEMU: "true"
    - BOARD: "x86_q35_uefi"
      TEST_CONFIG: ".ci/devices/qemu.json"
      MANUAL_TESTS_LIST: ".ci/test_lists/qemu.txt"
      QEMU: "true"

      # Novacustom
    - BOARD: "v540tnx"
      # TEST_CONFIG: ".ci/devices/novacustom-v540tnd_00266.json"
      # MANUAL_TESTS_LIST: ".ci/test_lists/basic.txt"
      EC_BOARD_VENDOR: "novacustom"
      EC_BOARD_MODEL: "v540tu"
      EC_REV: "f0439d8d95"
      BLOBS: "novacustom"
      CAPSULE: "yes"
      NETWORK: "office"
    - BOARD: "v560tnx"
      EC_BOARD_VENDOR: "novacustom"
      EC_BOARD_MODEL: "v560tnx"
      EC_REV: "f0439d8d95"
      BLOBS: "novacustom"
      CAPSULE: "yes"
    - BOARD: "v540tu"
      EC_BOARD_VENDOR: "novacustom"
      EC_BOARD_MODEL: "v540tu"
      EC_REV: "f0439d8d95"
      BLOBS: "novacustom"
      CAPSULE: "yes"
    - BOARD: "v560tu"
      EC_BOARD_VENDOR: "novacustom"
      EC_BOARD_MODEL: "v560tu"
      EC_REV: "f0439d8d95"
      BLOBS: "novacustom"
      CAPSULE: "yes"
    - BOARD: "nv4x_adl"
      EC_BOARD_VENDOR: "novacustom"
      EC_BOARD_MODEL: "nv4x_adl"
      EC_REV: "f0439d8d95"
      BLOBS: "novacustom"
      CAPSULE: "yes"
    - BOARD: "ns5x_adl"
      EC_BOARD_VENDOR: "novacustom"
      EC_BOARD_MODEL: "ns5x_adl"
      EC_REV: "f0439d8d95"
      BLOBS: "novacustom"
      CAPSULE: "yes"
    - BOARD: "nv4x_tgl"
      EC_BOARD_VENDOR: "novacustom"
      EC_BOARD_MODEL: "nv4x_tgl"
      EC_REV: "f0439d8d95"
      BLOBS: "novacustom"
      CAPSULE: "yes"
    - BOARD: "ns5x_tgl"
      EC_BOARD_VENDOR: "novacustom"
      EC_BOARD_MODEL: "ns5x_tgl"
      EC_REV: "f0439d8d95"
      BLOBS: "novacustom"
      CAPSULE: "yes"
    - BOARD: "nuc_box"
      BLOBS: "novacustom"
      CAPSULE: "yes"

    # MSI
    - BOARD: "ms7d25_ddr4"
      TEST_CONFIG: ".ci/devices/msi-pro-z690-a-wifi-ddr4_00039.json"
      MANUAL_TESTS_LIST: ".ci/test_lists/basic.txt"
      CAPSULE: "yes"
      NETWORK: "office"
    - BOARD: "ms7d25_ddr5"
      CAPSULE: "yes"
    - BOARD: "ms7e06_ddr4"
      CAPSULE: "yes"
    - BOARD: "ms7e06_ddr5"
      CAPSULE: "yes"

    # Dell
    - BOARD: "optiplex_9010_sff"
    - BOARD: "optiplex_9010_sff_uefi"

    # Protectli
    - BOARD: "vp66xx"
      CAPSULE: "yes"
    - BOARD: "vp46xx"
    - BOARD: "vp32xx"
    - BOARD: "vp2440"
    - BOARD: "vp2430"
    - BOARD: "vp2420"
    - BOARD: "vp2410"
    - BOARD: "v2210"
    - BOARD: "V1210"
    - BOARD: "V1211"
    - BOARD: "V1410"
    - BOARD: "V1610"

    # PC-Engines
    - BOARD: "apu2"
    - BOARD: "apu3"
    - BOARD: "apu4"
    - BOARD: "apu6"

    # Hardkernel
    - BOARD: "odroid_h4"
      CAPSULE: "yes"
    - BOARD: "odroid_h4_netcard"
      CAPSULE: "yes"

    # Asrock
    - BOARD: "asrock_spc741d8"

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true
      partial: false
      submodule_partial: false
      depth: 0

steps:
  - name: report-init
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    environment:
      GITHUB_REPO: Dasharo/coreboot
      GITHUB_COMMIT_TOKEN:
        from_secret: GITHUB_SYNC_TOKEN
      GITHUB_COMMIT_STATUS_TOKEN:
        from_secret: CONTENT_STATUSES_CI_TOKEN
    failure: ignore
    commands:
      - task --taskfile .ci/Taskfile.yml ci:report:init BOARD="${BOARD}"


  - name: ec
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/tmp/coreboot-builds:/var/tmp/coreboot-builds
    when:
      - matrix:
          EC_BOARD_VENDOR: "?*"
          EC_BOARD_MODEL: "?*"
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_BUILDER_TOKEN_REPO_READ
      HOSTPATH: /var/tmp/coreboot-builds/${CI_REPO_NAME}/${CI_PIPELINE_NUMBER}-${BOARD}
      GITHUB_TOKEN:
        from_secret: CONTENT_STATUSES_CI_TOKEN
    commands:
      - docker run --rm -v /var/tmp/coreboot-builds:/w alpine rm -rf /w/{{base .HOSTPATH}}
      - |
        task --taskfile .ci/Taskfile.yml ci:build-ec \
        EC_BOARD_VENDOR=${EC_BOARD_VENDOR} EC_BOARD_MODEL=${EC_BOARD_MODEL} \
        HOSTPATH="$${HOSTPATH}" EC_REV="${EC_REV}"
      - docker run --rm -v /var/tmp/coreboot-builds:/w alpine rm -rf /w/{{base .HOSTPATH}}


  - name: blobs
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    when:
      - matrix:
          BLOBS: "?*"
    environment:
      NCM_BLOBS_TOKEN:
        from_secret: GITEA_BUILDER_TOKEN_REPO_READ
    commands:
      - task --taskfile .ci/Taskfile.yml ci:blobs BLOBS=${BLOBS}


  - name: build
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/tmp/coreboot-builds:/var/tmp/coreboot-builds
    environment:
      SSH_AUTH_SOCK: /tmp/no-ssh-agent
      HOSTPATH: /var/tmp/coreboot-builds/${CI_REPO_NAME}/${CI_PIPELINE_NUMBER}-${BOARD}
      GITHUB_TOKEN:
        from_secret: CONTENT_STATUSES_CI_TOKEN
    when:
      - matrix:
          BOARD: "?*"
    commands:
      - docker run --rm -v /var/tmp/coreboot-builds:/w alpine rm -rf /w/{{base .HOSTPATH}}
      - |
        task --taskfile .ci/Taskfile.yml ci:build-coreboot \
        BOARD="${BOARD}" HOSTPATH="$${HOSTPATH}" \
        EDK2_REPO="${EDK2_REPO}" EDK2_REV="${EDK2_REV}"
      - docker run --rm -v /var/tmp/coreboot-builds:/w alpine rm -rf /w/{{base .HOSTPATH}}

  - name: test-qemu
    image: git.3mdeb.com/dasharo/osfv-qemu-ci:latest
    pull: true
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_BUILDER_TOKEN_REPO_READ
      NFS_IP: 192.168.10.217
      QEMU_HDD_BASE: /srv/nfs/disk-images/qemu/ubuntu_windows_compacted.qcow2
    privileged: true # for /dev/kvm
    when:
      - matrix:
          QEMU: "true"
    commands:
      - mkdir -p /srv/nfs/disk-images
      - mount -t nfs -o nolock,ro "$${NFS_IP}":/srv/nfs/disk-images /srv/nfs/disk-images
      - mountpoint -q /srv/nfs/disk-images
      - |
        task --taskfile .ci/Taskfile.yml ci:test \
        TEST_CONFIG=${TEST_CONFIG} MANUAL_TESTS_LIST="${MANUAL_TESTS_LIST}"


  - name: test
    image: git.3mdeb.com/dasharo/osfv-qemu-ci:latest
    pull: true
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_BUILDER_TOKEN_REPO_READ
      SNIPEIT_CONFIG:
        from_secret: SNIPEIT_YAML_CONFIG_FILE
    when:
      - matrix:
          TEST_CONFIG: "**/?*"
        evaluate: 'QEMU != "true"'
    commands:
      - mkdir -p /root/.osfv
      - printf '%s\n' "$${SNIPEIT_CONFIG}" > /root/.osfv/snipeit.yml
      - chmod 600 /root/.osfv/snipeit.yml
      - |
        task --taskfile .ci/Taskfile.yml ci:test \
        TEST_CONFIG=${TEST_CONFIG} MANUAL_TESTS_LIST="${MANUAL_TESTS_LIST}" \
        QEMU="${QEMU}"


  - name: report
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    when:
      - status: [success, failure]
    environment:
      GITHUB_REPO: Dasharo/coreboot
      GITHUB_TOKEN:
        from_secret: GITHUB_SYNC_TOKEN
      WOODPECKER_TOKEN:
        from_secret: WOODPECKER_BUILDER_API_TOKEN
    failure: ignore
    commands:
      - task --taskfile .ci/Taskfile.yml ci:report:publish BOARD="${BOARD}"


  - name: cleanup
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    when:
      - status: [success, failure]
    volumes:
      - /var/tmp/coreboot-builds:/var/tmp/coreboot-builds
    environment:
        HOSTPATH: /var/tmp/coreboot-builds/${CI_REPO_NAME}/${CI_PIPELINE_NUMBER}-${BOARD}
    commands:
      - task --taskfile .ci/Taskfile.yml ci:cleanup HOSTPATH="$${HOSTPATH}"
