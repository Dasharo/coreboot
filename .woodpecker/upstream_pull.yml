when:
  - event: cron
    cron: upstream
  - event: manual

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  - name: upstream-pull
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    pull: true
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_BUILDER_TOKEN_REBASE_CI
    commands:
      - task --taskfile .ci/Taskfile.yml ci:upstream:pull
