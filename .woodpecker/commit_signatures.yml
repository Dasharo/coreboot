# Mark "ci/woodpecker/<event>/commit_signatures" as a required status check
# in the Gitea branch protection rules.

when:
  - event: [push, pull_request, manual]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false
      partial: false
      depth: 0

steps:
  - name: commit-signatures
    image: git.3mdeb.com/dasharo/coreboot-build-ci:latest
    pull: true
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_BUILDER_TOKEN_REPO_READ
    commands:
      - task --taskfile .ci/Taskfile.yml ci:check CHECK=commit-signatures
